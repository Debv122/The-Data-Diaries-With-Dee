<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | The Data Diaries With Dee</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{--paper:#F2EDF0;--surface:#FBF8FA;--ink:#191420;--body:#2E2733;--muted:#6B6273;--ember:#B0522F;--line:rgba(25,20,32,.15);
--display:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--paper:#100C13;--surface:#1A1421;--ink:#F6F0F3;--body:#E2D9E1;--muted:#A79CB0;--ember:#E4906F;--line:rgba(246,240,243,.16)}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--body);font:17px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.strip{background:#12100E;padding:11px 24px;font:12px var(--mono);letter-spacing:.06em}.strip a{color:#E8734A;text-decoration:none}.strip .s{color:rgba(255,255,255,.25);margin:0 10px}.strip .r{color:rgba(255,255,255,.55)}
main{max-width:560px;margin:0 auto;padding:clamp(28px,6vw,64px) 20px}
h1{font:400 clamp(1.9rem,5vw,2.6rem)/1.15 var(--display);color:var(--ink);margin:0 0 10px}h2{font:400 1.35rem var(--display);color:var(--ink);margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 26px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
label{display:block;font:500 14px var(--sans);color:var(--ink);margin:14px 0 5px}
input[type=email],input[type=password]{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:16px var(--sans)}
button,.btn{display:inline-block;border:0;border-radius:8px;background:var(--ember);color:#fff;padding:12px 20px;font:600 15px var(--sans);cursor:pointer;text-decoration:none}
button.alt,.btn.alt{background:transparent;color:var(--ember);border:1px solid var(--ember)}button:disabled{opacity:.6}
.tabs{display:flex;gap:6px;margin-bottom:18px}.tabs button{flex:1;background:transparent;color:var(--muted);border:1px solid var(--line)}.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.msg{margin-top:14px;font-size:15px;min-height:1.4em}.msg.err{color:#B3261E}.msg.ok{color:#1B6B3A}
.link{background:none;color:var(--ember);padding:0;font:inherit;text-decoration:underline}
.course{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface);margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--ember)}
.small{font-size:14px;color:var(--muted)}pre.sub{white-space:pre-wrap;font:14px/1.5 var(--sans);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 0;max-height:160px;overflow:auto}
[hidden]{display:none!important}</style></head><body>
<div class="strip"><a href="/emberlern">&larr; Emberlern</a><span class="s">/</span><a class="r" href="/">The Data Diaries With Dee</a></div>
<main>
<h1 id="title">Sign in to your courses</h1>
<p class="lead" id="lead">Free account. Save your progress, submit drills and unlock every module.</p>
<div class="card">
<div id="setup" class="msg err" style="display:none">Accounts are not switched on yet. The site owner still needs to add the Supabase keys in auth.js.</div>
<div id="main-form">
<div class="tabs"><button type="button" id="t-in" class="on">Sign in</button><button type="button" id="t-up">Create account</button></div>
<form id="f" novalidate>
<label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="pw" id="pwl">Password</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
<p style="margin-top:18px"><button type="submit" id="go">Sign in</button></p>
</form>
<p class="small" style="margin-top:12px"><button type="button" class="link" id="forgot">Forgot your password?</button></p>
<div id="gwrap" style="display:none;margin-top:14px"><button type="button" class="alt" id="g">Continue with Google</button></div>
</div>
<form id="f2" style="display:none" novalidate><h2>Choose a new password</h2>
<label for="np">New password (8+ characters)</label><input id="np" type="password" autocomplete="new-password" minlength="8">
<p style="margin-top:18px"><button type="submit">Save password</button></p></form>
<div class="msg" id="msg" role="status"></div>
</div></main>
<script src="/auth.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
var $=function(i){return document.getElementById(i)},mode='in',msg=$('msg');
var next=new URLSearchParams(location.search).get('next');
function say(t,c){msg.textContent=t;msg.className='msg '+(c||'')}
function setMode(m){mode=m;$('t-in').className=m=='in'?'on':'';$('t-up').className=m=='up'?'on':'';
 $('go').textContent=m=='in'?'Sign in':'Create free account';$('pw').autocomplete=m=='in'?'current-password':'new-password';say('')}
$('t-in').onclick=function(){setMode('in')};$('t-up').onclick=function(){setMode('up')};
if(!DD.configured){$('setup').style.display='block';$('main-form').style.display='none';return}
DD.ready.then(function(){
 if(!DD.client){say('Could not load the sign-in service. Check your connection and refresh.','err');return}
 if(DD.config.GOOGLE_LOGIN){$('gwrap').style.display='block';$('g').onclick=function(){DD.google(next)}}
 if(/type=recovery/.test(location.hash)){$('main-form').style.display='none';$('f2').style.display='block';$('title').textContent='Reset your password';return}
 if(DD.user){location.replace(DD.safeNext(next));return}
 $('f').onsubmit=function(e){e.preventDefault();var em=$('email').value.trim(),pw=$('pw').value;
  if(!em||pw.length<8){say('Enter your email and a password of at least 8 characters.','err');return}
  $('go').disabled=true;say('One moment...');
  var p=mode=='in'?DD.signIn(em,pw):DD.signUp(em,pw);
  p.then(function(r){$('go').disabled=false;
   if(r.error){say(r.error.message,'err');return}
   if(mode=='up'&&!r.data.session){say('Check your inbox: we sent a confirmation link to '+em+'. Click it, then sign in.','ok');return}
   location.replace(DD.safeNext(next))})};
 $('forgot').onclick=function(){var em=$('email').value.trim();if(!em){say('Type your email above first.','err');return}
  DD.reset(em).then(function(r){say(r.error?r.error.message:'If that email has an account, a reset link is on its way.',r.error?'err':'ok')})};
 $('f2').onsubmit=function(e){e.preventDefault();var p=$('np').value;if(p.length<8){say('Use at least 8 characters.','err');return}
  DD.setPassword(p).then(function(r){if(r.error){say(r.error.message,'err')}else{say('Password updated. Taking you to your courses...','ok');setTimeout(function(){location.replace('/account')},1200)}})};
});});
</script></body></html>
